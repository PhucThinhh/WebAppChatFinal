server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/chatapp}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatapp}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
brevo.api.key=${BREVO_API_KEY:}

jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-deploy-32chars}
jwt.expiration=${JWT_EXPIRATION:3600000}

aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-southeast-1}
aws.bucketName=${AWS_BUCKET_NAME:}

gemini.api.key=${GEMINI_API_KEY:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://binchat.me,http://www.binchat.me,https://web-app-chat-final.vercel.app,https://*.vercel.app}
