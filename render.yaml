services:
  - type: web
    name: kindchat-api
    runtime: docker
    plan: free
    rootDir: ChatApp
    envVars:
      - key: PORT
        value: 8080
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_JDBC_URL
        sync: false
      - key: MYSQL_USERNAME
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
